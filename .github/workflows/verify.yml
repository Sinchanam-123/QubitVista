# Correctness gate for QubitVista.
#
# Eight checks, and they are deliberately not redundant:
#
#   conformance_test*.py  the 181 golden circuits, value for value
#   verify_live.py        the same physics recomputed in plain NumPy with no
#                         Qiskit anywhere, so a mistake in how Qiskit is driven
#                         cannot be agreed with by every other test
#   fuzz2.py              the invariants, on circuits nobody wrote down — run
#                         twice, because it defaults to the engine2 reference
#                         and the engine that ships is quantum_engine. The
#                         reference run alone would never touch production code
#   cross_engine_test.mjs the browser fallback engines, which a user working
#                         offline sees instead of the backend
#   catalogue_drift_test  the static catalogue the frontend serves offline,
#                         fetched back off a live uvicorn route by route. The
#                         numbers have their own checks; this is the one that
#                         stops the TEACHING content from differing between a
#                         reader who has the backend and one who does not
#
# If one fails the code is wrong, not the data. Never edit a spec or loosen a
# tolerance to make this pass.

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: backend
        # Named tests_*.py, so pytest has to be pointed at them explicitly.
        run: pytest tests_phase1.py tests_phase2.py

      - name: Golden circuits — one qubit
        working-directory: backend
        run: python conformance_test.py --engine quantum_engine

      - name: Golden circuits — two qubits
        working-directory: backend
        run: python conformance_test_2q.py --engine quantum_engine

      - name: Independent recomputation — one qubit
        working-directory: backend
        run: python verify_live.py --engine quantum_engine --trials 3000

      - name: Independent recomputation — two qubits
        working-directory: backend
        run: python verify_live.py --engine quantum_engine --trials 3000 --qubits 2

      - name: Property-based invariants — reference engine
        working-directory: backend
        # No --engine, so this is engine2, the independent reference.
        run: python fuzz2.py 20000

      - name: Property-based invariants — shipping engine
        working-directory: backend
        # The engine the API actually serves from. Without this the fuzzing
        # only ever exercised the reference implementation.
        run: python fuzz2.py 20000 --engine quantum_engine

      - name: Static catalogue vs the live API
        working-directory: backend
        # Starts its own uvicorn and fetches all 185 catalogue routes. Fails if
        # the committed frontend/src/data/catalogue*.json differ by one
        # character of teaching text — re-run export_catalogue.py, never edit
        # the JSON.
        run: python catalogue_drift_test.py

      - name: Browser engines vs the backend
        working-directory: frontend
        run: node cross_engine_test.mjs

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
